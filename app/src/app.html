		<script type="application/ld+json">
			{
				"@context": "https://schema.org",
				"@type": "WebApplication",
				"name": "Gaslands Garage",
				"url": "https://gaslandsgarage.com/builder",

			}
		</script>
		<script>
			// The static shell is shared by every route. Point title, description,
			// and canonical at the real page before the app bundle loads.
			(function () {
				var path = (location.pathname || '/').replace(/\/+$/, '') || '/';
				if (path === '/' || path === '/index.html') path = '/builder';
				var pages = {
					'/builder': {
						title: 'Gaslands Garage - Team Builder',
						description: 'Free Gaslands team builder: build vehicles, add weapons, upgrades and perks, check cans, and print team cards.',
						canonical: 'https://gaslandsgarage.com/builder'
					},
					'/stats': {
						title: 'Usage Stats - Gaslands Garage',
						description: 'Anonymous usage totals for saved Gaslands Garage teams. Individual teams and accounts stay private.',
						canonical: 'https://gaslandsgarage.com/stats',
						robots: 'noindex'
					},
					'/admin/users': {
						title: 'Users - Gaslands Garage',
						description: 'Administrator account management for Gaslands Garage.',
						canonical: 'https://gaslandsgarage.com/admin/users',
						robots: 'noindex'
					},
					'/players': {
						title: 'Players map - Gaslands Garage',
						description: 'Approximate map of Gaslands Garage players who chose to appear. Anonymous pins have no name.',
						canonical: 'https://gaslandsgarage.com/players',
						robots: 'noindex'
					},
					'/profile': {
						title: 'Player profile - Gaslands Garage',
						description: 'Optional player profile for Gaslands Garage. Location is approximate, and contact never shares your email.',
						canonical: 'https://gaslandsgarage.com/profile',
						robots: 'noindex'
					},
					'/privacy': {
						title: 'Privacy Policy - Gaslands Garage',
						description: 'Privacy Policy for Gaslands Garage: Google sign-in, saved teams, the players map, game requests, and what is public.',
						canonical: 'https://gaslandsgarage.com/privacy'
					},
					'/terms': {
						title: 'Terms and Conditions - Gaslands Garage',
						description: 'Terms and Conditions for Gaslands Garage, a free fan-made Gaslands team builder operated by Anes & Rincon LLC.',
						canonical: 'https://gaslandsgarage.com/terms'
					}
				};
				var page = pages[path];
				if (!page) return;
				document.title = page.title;
				var description = document.querySelector('meta[name="description"]');
				if (description) description.setAttribute('content', page.description);
				var canonical = document.querySelector('link[rel="canonical"]');
				if (canonical) canonical.setAttribute('href', page.canonical);
				var ogTitle = document.querySelector('meta[property="og:title"]');
				if (ogTitle) ogTitle.setAttribute('content', page.title);
				var ogDescription = document.querySelector('meta[property="og:description"]');
				if (ogDescription) ogDescription.setAttribute('content', page.description);
				var ogUrl = document.querySelector('meta[property="og:url"]');
				if (ogUrl) ogUrl.setAttribute('content', page.canonical);
				var twitterTitle = document.querySelector('meta[name="twitter:title"]');
				if (twitterTitle) twitterTitle.setAttribute('content', page.title);
				var twitterDescription = document.querySelector('meta[name="twitter:description"]');
				if (twitterDescription) twitterDescription.setAttribute('content', page.description);
				if (page.robots && !document.querySelector('meta[name="robots"]')) {
					var robots = document.createElement('meta');
					robots.name = 'robots';
					robots.content = page.robots;
					document.head.appendChild(robots);
				}
				if (path !== '/builder') {
					var structuredData = document.querySelector('script[type="application/ld+json"]');
					if (structuredData && structuredData.parentNode) structuredData.parentNode.removeChild(structuredData);
				}
			})();
		</script>
		<!-- Consent Mode v2 defaults run before gtag.js. Advertising storage stays denied. -->
		<script>
			(function () {
				var pair = /([?&#])(draft|emailInvite)=[^&#]*/gi;
				var encoded = /(draft|emailInvite)%3D[^&#%]*/gi;
				function redact(value) {
					if (typeof value !== 'string') return value;
					return value.replace(pair, '$1$2=(redacted)').replace(encoded, '$1%3D(redacted)');
				}
				try {
					var url = new URL(window.location.href);
					var changed = false;
					if (url.searchParams.has('draft')) {
						sessionStorage.setItem('gaslands.pendingDraft', url.searchParams.get('draft') || '');
						url.searchParams.delete('draft');
						changed = true;
					}
					if (url.searchParams.has('emailInvite')) {
						sessionStorage.setItem('gaslands.emailInvite', url.searchParams.get('emailInvite') || '');
						url.searchParams.delete('emailInvite');
						changed = true;
					}
					if (changed) history.replaceState(history.state, '', url.pathname + url.search + url.hash);
				} catch (e) {}
				if (navigator.sendBeacon) {
					var beacon = navigator.sendBeacon.bind(navigator);
					navigator.sendBeacon = function (target, data) {
						var nextTarget = typeof target === 'string' ? redact(target) : target;
						var nextData = typeof data === 'string' ? redact(data) : data;
						return beacon(nextTarget, nextData);
					};
				}
				if (window.fetch) {
					var origFetch = window.fetch.bind(window);
					window.fetch = function (input, init) {
						var target = typeof input === 'string' ? input : (input && input.url) || '';
						if (/google-analytics\.com|analytics\.google\.com|googletagmanager\.com/i.test(String(target))) {
							if (typeof input === 'string') input = redact(input);
							if (init && typeof init.body === 'string') init = Object.assign({}, init, { body: redact(init.body) });
						}
						return origFetch(input, init);
					};
				}
			})();
			window.dataLayer = window.dataLayer || [];
			function gtag(){dataLayer.push(arguments);}
			window.gtag = gtag;
			var consentRegions = ["AT","BE","BG","CH","CY","CZ","DE","DK","EE","ES","FI","FR","GB","GR","HR","HU","IE","IS","IT","LI","LT","LU","LV","MT","NL","NO","PL","PT","RO","SE","SI","SK"];
			gtag('consent', 'default', {
				analytics_storage: 'denied',
				ad_storage: 'denied',
				ad_user_data: 'denied',
				ad_personalization: 'denied',
				region: consentRegions,
				wait_for_update: 500
			});
			// Browser timezone backs up the IP region list: a Europe/* (or listed) zone
			// starts denied even when Google does not place the IP in the EEA, UK, or CH.
			var consentTimeZones = ["Africa/Ceuta","America/Cayenne","America/Guadeloupe","America/Marigot","America/Martinique","America/St_Barthelemy","Arctic/Longyearbyen","Asia/Famagusta","Asia/Nicosia","Atlantic/Azores","Atlantic/Canary","Atlantic/Madeira","Atlantic/Reykjavik","Indian/Mayotte","Indian/Reunion"];
			var viewerTimeZone = '';
			try {
				viewerTimeZone = Intl.DateTimeFormat().resolvedOptions().timeZone || '';
			} catch (e) {
				viewerTimeZone = '';
			}
			var consentTimeZone = viewerTimeZone.indexOf('Europe/') === 0 || consentTimeZones.indexOf(viewerTimeZone) !== -1;
			gtag('consent', 'default', {
				analytics_storage: consentTimeZone ? 'denied' : 'granted',
				ad_storage: 'denied',
				ad_user_data: 'denied',
				ad_personalization: 'denied'
			});
			var analyticsChoice = null;
			try {
				var gpc = navigator.globalPrivacyControl === true;
				var storedConsent = JSON.parse(localStorage.getItem('gaslands.analyticsConsent.v1') || 'null');
				var storedChoice = storedConsent && (storedConsent.choice === 'accepted' || storedConsent.choice === 'rejected') ? storedConsent.choice : null;
				if (gpc && !(storedChoice === 'accepted' && storedConsent.gpc === true)) analyticsChoice = 'denied';
				else if (storedChoice === 'accepted') analyticsChoice = 'granted';
				else if (storedChoice === 'rejected') analyticsChoice = 'denied';
			} catch (e) {
				analyticsChoice = null;
			}
			if (analyticsChoice) {
				gtag('consent', 'update', {
					analytics_storage: analyticsChoice,
					ad_storage: 'denied',
					ad_user_data: 'denied',
					ad_personalization: 'denied'
				});
			}
		</script>
		<script async src="https://www.googletagmanager.com/gtag/js?id=G-EKPMXMY097"></script>
		<script>
			gtag('js', new Date());
			gtag('config', 'G-EKPMXMY097', {
				page_location: location.origin + location.pathname,
				page_referrer: (document.referrer || '').split('?')[0],
				allow_google_signals: false,
				allow_ad_personalization_signals: false
			});
		</script>
