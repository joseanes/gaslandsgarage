name: Test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        # The UI tests start the Functions emulator, which needs Node 22.
        run: pnpm install --frozen-lockfile --config.engine-strict=false

      - name: Typecheck
        working-directory: app
        run: pnpm check

      - name: Unit tests
        working-directory: app
        run: pnpm test

      - name: Usage stats unit tests
        working-directory: stats
        run: |
          pnpm check
          pnpm test

      - name: Build app
        working-directory: app
        run: |
          pnpm build 2>&1 | tee /tmp/app-build.log
          if grep -E 'h-\[1\.5rem\]|empty block' /tmp/app-build.log; then
            echo "Build still reports empty-block or invalid height warnings"
            exit 1
          fi

      - name: Install Java for the Firebase emulators
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21

      - name: Typecheck admin bootstrap
        run: pnpm exec tsc -p scripts/tsconfig.json

      - name: Firestore and Storage rules tests
        working-directory: app
        run: pnpm test:rules

      - name: Install Playwright browser
        working-directory: app
        run: pnpm exec playwright install --with-deps chromium

      - name: UI tests
        working-directory: app
        run: pnpm test:e2e

      - name: Build infra
        working-directory: infra
        run: pnpm build

      - name: Infra tests
        working-directory: infra
        run: pnpm test

  functions:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Java for the Firebase emulators
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21

      - name: Cloud Functions
        working-directory: functions
        run: |
          pnpm check
          pnpm build
          if grep -E 'FIREBASE_SERVICE_ACCOUNT|private_key' lib/index.js; then
            echo "Built functions bundle mentions a service account key"
            exit 1
          fi
          # Self-service account deletion is the only Auth delete. Admin disable must not delete users.
          if grep -n 'deleteUser' src/disableUser.ts src/contactEmail.ts src/index.ts; then
            echo "Admin and contact functions must not delete Auth users"
            exit 1
          fi
          pnpm test
