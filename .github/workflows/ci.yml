name: Build-and-Deploy
on:
  push:
    branches: [main]

jobs:
  # Every merge to main lands on staging first: site, Firestore/Storage rules,
  # indexes, and functions in the gaslandsgarage-staging Firebase project.
  staging:
    runs-on: ubuntu-latest
    concurrency: { group: staging-deploy, cancel-in-progress: false }
    permissions:
      contents: read
      id-token: write
    env:
      AWS_DEPLOY_ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
    - uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3
      with: { version: 9, run_install: false }
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with: { node-version: '22', cache: 'pnpm' }

    - name: Configure AWS with GitHub OIDC
      uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
      with:
        aws-region: ${{ env.AWS_REGION }}
        role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
        role-session-name: gaslands-garage-staging-deploy

    - run: pnpm install

    - name: Build SvelteKit (staging Firebase config)
      working-directory: app
      run: pnpm run build:staging

    - name: CDK Deploy staging stacks
      working-directory: infra
      run: |
        pnpm run build
        npx cdk deploy StagingCertificateStack StagingInfraStack --exclusively --require-approval never

    - name: Upload staging site
      run: scripts/deploy-staging-site.sh

    # Keyless: Workload Identity Federation in the staging project only. The
    # provider accepts this repository on refs/heads/main and nothing else.
    - name: Authenticate to Google Cloud (staging)
      uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
      with:
        workload_identity_provider: projects/1059520931399/locations/global/workloadIdentityPools/github-actions/providers/gaslandsgarage
        service_account: github-staging-deploy@gaslandsgarage-staging.iam.gserviceaccount.com

    - name: Deploy Firebase rules, indexes, and functions to staging
      run: |
        echo "MAIL_FROM_ADDRESS=noreply@gaslandsgarage.com" > functions/.env.gaslandsgarage-staging
        # No --force: a deploy that would delete a function or index fails instead.
        npx --yes firebase-tools@13.29.1 deploy \
          --only firestore:rules,firestore:indexes,storage,functions \
          --project staging --non-interactive

  # Production waits for staging and for José's approval on the
  # "production" GitHub environment. Steps are unchanged.
  deploy:
    needs: staging
    environment: production
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      # Empty until José creates the role and stores its ARN. The key path below stays until then.
      AWS_DEPLOY_ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
    - uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3
      with: { version: 9, run_install: false }
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with: { node-version: '20', cache: 'pnpm' }

    - name: Configure AWS with GitHub OIDC
      if: env.AWS_DEPLOY_ROLE_ARN != ''
      uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
      with:
        aws-region: ${{ env.AWS_REGION }}
        role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
        role-session-name: gaslands-garage-deploy

    - name: Configure AWS with access keys
      if: env.AWS_DEPLOY_ROLE_ARN == ''
      uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
      with:
        aws-region: ${{ env.AWS_REGION }}
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    # ---------- Install workspace deps ----------
    - run: pnpm install

    # ---------- Build SvelteKit ----------
    - name: Build SvelteKit
      working-directory: app
      run: pnpm run build

    # -------- CDK Bootstrap --------
    - name: CDK Bootstrap
      working-directory: infra
      run: |
        ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
        npx cdk bootstrap aws://$ACCOUNT/$AWS_REGION --require-approval never

    # -------- CDK Deploy --------
    - name: CDK Deploy
      working-directory: infra
      run: |
        pnpm run build
        npx cdk deploy CertificateStack --require-approval never
        npx cdk deploy InfraStack --require-approval never

    # -------- Upload files to S3 --------
    - name: Get S3 bucket name
      working-directory: infra
      run: |
        # Extract bucket name from CDK outputs
        BUCKET_NAME=$(aws cloudformation describe-stacks --stack-name InfraStack --query "Stacks[0].Outputs[?OutputKey=='BucketName'].OutputValue" --output text)
        echo "BUCKET_NAME=$BUCKET_NAME" >> $GITHUB_ENV

    - name: Upload SvelteKit build to S3
      run: |
        echo "Uploading files to S3 bucket: $BUCKET_NAME"
        ls -la app/build/
        # Keep previous /_app/immutable hashes. sync --delete would remove the
        # chunks an older cached index.html still names, and the vehicle list
        # then renders nothing. Replaced hashes are pruned after 14 days.
        aws s3 sync app/build/ s3://$BUCKET_NAME/ --delete \
          --exclude "_app/immutable/*" \
          --exclude "_app/immutable/*/*" \
          --exclude "_app/immutable/*/*/*"
        aws s3 sync app/build/_app/immutable/ s3://$BUCKET_NAME/_app/immutable/ \
          --cache-control "public, max-age=31536000, immutable" \
          --size-only
        # Object metadata as well as the CloudFront default behavior. index.html
        # must not be stored as immutable or a browser keeps asking for deleted chunks.
        while IFS= read -r -d '' html; do
          key="${html#app/build/}"
          aws s3 cp "$html" "s3://$BUCKET_NAME/$key" \
            --cache-control "no-cache" \
            --content-type "text/html; charset=utf-8"
        done < <(find app/build -name '*.html' -print0)
        node scripts/prune-immutable.mjs "$BUCKET_NAME" app/build 14
        # The icon responses need image types. A generic binary type makes the tab fall back to the default globe.
        aws s3 cp app/build/favicon.ico s3://$BUCKET_NAME/favicon.ico --content-type image/x-icon --cache-control max-age=86400
        aws s3 cp app/build/favicon.svg s3://$BUCKET_NAME/favicon.svg --content-type image/svg+xml --cache-control max-age=86400
        aws s3 cp app/build/apple-touch-icon.png s3://$BUCKET_NAME/apple-touch-icon.png --content-type image/png --cache-control max-age=86400
        aws s3 cp app/build/icon-192.png s3://$BUCKET_NAME/icon-192.png --content-type image/png --cache-control max-age=86400
        aws s3 cp app/build/icon-512.png s3://$BUCKET_NAME/icon-512.png --content-type image/png --cache-control max-age=86400
        aws s3 cp app/build/site.webmanifest s3://$BUCKET_NAME/site.webmanifest --content-type application/manifest+json --cache-control max-age=86400

    - name: Invalidate CloudFront cache
      run: |
        # Get the full CloudFront distribution domain
        CF_DOMAIN=$(aws cloudformation describe-stacks --stack-name InfraStack --query "Stacks[0].Outputs[?OutputKey=='CDNDistributionDomainName'].OutputValue" --output text)
        echo "CloudFront Domain: $CF_DOMAIN"

        # List all CloudFront distributions and find the matching one
        DIST_ID=$(aws cloudfront list-distributions --query "DistributionList.Items[?DomainName=='$CF_DOMAIN'].Id" --output text)
        echo "Distribution ID: $DIST_ID"

        # Only invalidate if we found a distribution ID
        if [ -n "$DIST_ID" ]; then
          # Invalidate the entire distribution
          aws cloudfront create-invalidation --distribution-id $DIST_ID --paths "/*"
        else
          echo "Could not find CloudFront distribution ID. Skipping invalidation."
        fi
