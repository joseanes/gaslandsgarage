# Manual fallback for stats/public and users/{uid}.
# The daily run is the publishUsageStats Cloud Function at 06:15 America/New_York.
# See docs/FUNCTIONS.md. This schedule is disabled. workflow_dispatch remains so
# the job can still be run by hand.
# After that function has published once, the usage-stats service account key and
# the FIREBASE_SERVICE_ACCOUNT GitHub secret can be deleted. This workflow does
# not delete them. Deleting the secret makes this manual run fail.
name: Usage stats

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Publish stats/public and sync users
        working-directory: stats
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: pnpm publish-stats
